<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#f5f5f5"/>
  <rect x="2" y="2" width="796" height="446" stroke="black" stroke-width="2" fill="white"/>

  <!-- Flow diagram -->
  <rect x="60" y="180" width="140" height="80" stroke="black" stroke-width="2" fill="black"/>
  <text x="130" y="215" font-family="monospace" font-size="12" text-anchor="middle" fill="white">REGISTER</text>
  <text x="130" y="232" font-family="monospace" font-size="12" text-anchor="middle" fill="white">AGENT</text>

  <polygon points="220,220 250,220 250,210 270,225 250,240 250,230 220,230" fill="black"/>

  <rect x="290" y="180" width="140" height="80" stroke="black" stroke-width="2" fill="white"/>
  <text x="360" y="215" font-family="monospace" font-size="12" text-anchor="middle" fill="black">ISSUE</text>
  <text x="360" y="232" font-family="monospace" font-size="12" text-anchor="middle" fill="black">CREDENTIALS</text>

  <polygon points="450,220 480,220 480,210 500,225 480,240 480,230 450,230" fill="black"/>

  <rect x="520" y="180" width="140" height="80" stroke="black" stroke-width="2" fill="white"/>
  <text x="590" y="215" font-family="monospace" font-size="12" text-anchor="middle" fill="black">DEPLOY</text>
  <text x="590" y="232" font-family="monospace" font-size="12" text-anchor="middle" fill="black">MISSION</text>

  <polygon points="680,220 710,220 710,210 730,225 710,240 710,230 680,230" fill="black"/>

  <!-- Final state -->
  <circle cx="760" cy="225" r="25" stroke="black" stroke-width="2" fill="black"/>
  <text x="760" y="230" font-family="monospace" font-size="10" text-anchor="middle" fill="white">LIVE</text>

  <!-- Labels below -->
  <text x="130" y="290" font-family="monospace" font-size="10" text-anchor="middle" fill="black">ERC-8004</text>
  <text x="360" y="290" font-family="monospace" font-size="10" text-anchor="middle" fill="black">VERIFIABLE</text>
  <text x="590" y="290" font-family="monospace" font-size="10" text-anchor="middle" fill="black">SCOPED AUTH</text>

  <!-- Title -->
  <text x="400" y="50" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="black">BUILD YOUR OWN AGENT</text>
  <text x="400" y="75" font-family="monospace" font-size="12" text-anchor="middle" fill="black">Identity-first agent deployment in 3 steps</text>

  <!-- Bottom section -->
  <rect x="200" y="340" width="400" height="80" stroke="black" stroke-width="2" fill="#f5f5f5"/>
  <text x="400" y="370" font-family="monospace" font-size="11" text-anchor="middle" fill="black">npm install @supermission/sdk</text>
  <text x="400" y="395" font-family="monospace" font-size="11" text-anchor="middle" fill="black">supermission deploy --agent my-agent</text>
</svg>
